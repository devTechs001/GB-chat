# GBChat — horizontally scalable stack
#
#   docker compose up --build
#   open http://localhost  (frontend)
#          http://localhost:8080/lb-health (load balancer)
#
# Topology
#   client  ──> lb (nginx, ip_hash) ──> server1 / server2  (API + Socket.IO + gRPC)
#                                          │        │
#                                     mongodb    redis  (adapter + cache + presence)
#
# Scaling out is a one-liner:
#   docker compose up -d --scale server1=1 --scale server2=1   # or add more replicas
#   (add the new replica to docker/nginx-lb.conf upstream, or use `--scale server=3`
#    with the `server` service below and DNS round-robin)
name: gbchat

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-gbchat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-gbchat_secret}
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [gbchat-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-gbchat_redis}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gbchat_redis}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [gbchat-network]

  # ---- API replicas -------------------------------------------------------
  # Both replicas run the same image. The Redis adapter links their Socket.IO
  # rooms, so a message emitted on server1 reaches clients connected to server2.
  server1: &server-template
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &server-env
      NODE_ENV: production
      PORT: 5000
      GRPC_PORT: 50051
      NODE_ID: server1
      MONGODB_URI: mongodb://${MONGO_USERNAME:-gbchat}:${MONGO_PASSWORD:-gbchat_secret}@mongodb:27017/gbchat?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-gbchat_redis}@redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:-internal_token_change_me}
      TRUST_PROXY: 1
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      # The dedicated `worker` service owns the cron jobs in this stack.
      SCHEDULER_ENABLED: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # ---- Microservice composition -------------------------------------
      # GATEWAY_ROUTES lists the services that own their prefixes. Anything
      # not listed stays mounted inside the API replicas, so the stack boots
      # and behaves exactly as before with `GATEWAY_ROUTES` unset/empty.
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
      GATEWAY_ROUTES: ${GATEWAY_ROUTES:-}
      GATEWAY_IDENTITY_URL: http://identity:5001
      GATEWAY_MESSAGING_URL: http://messaging:5002
      GATEWAY_SOCIAL_URL: http://social:5003
      GATEWAY_CONTENT_URL: http://content:5004
      GATEWAY_DATA_URL: http://data:5005
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-30000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    expose: ["5000", "50051"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/system/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [gbchat-network]

  server2:
    <<: *server-template
    environment:
      <<: *server-env
      NODE_ID: server2

  # ---- Microservices -----------------------------------------------------
  # One container per service, same image, same routers — the entrypoint just
  # narrows the route table. Scale one independently:
  #   docker compose up -d --scale social=3
  # They are profile-gated (`--profile services`) so a plain `docker compose up`
  # starts the monolith exactly as before.
  #
  # Socket.IO and gRPC stay on the API replicas: realtime needs sticky sessions
  # and a Redis adapter, which is a separate problem from stateless HTTP routes.
  identity: &service-template
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles: ["services"]
    restart: unless-stopped
    command: ["node", "services/gateway/serviceEntry.js", "identity"]
    environment:
      <<: *server-env
      SERVICE: identity
      PORT: 5001
      NODE_ID: identity
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      GATEWAY_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    expose: ["5001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [gbchat-network]

  messaging:
    <<: *service-template
    command: ["node", "services/gateway/serviceEntry.js", "messaging"]
    environment:
      <<: *server-env
      SERVICE: messaging
      PORT: 5002
      NODE_ID: messaging
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      GATEWAY_ENABLED: "false"
    expose: ["5002"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5002/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  social:
    <<: *service-template
    command: ["node", "services/gateway/serviceEntry.js", "social"]
    environment:
      <<: *server-env
      SERVICE: social
      PORT: 5003
      NODE_ID: social
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      GATEWAY_ENABLED: "false"
    expose: ["5003"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5003/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  content:
    <<: *service-template
    command: ["node", "services/gateway/serviceEntry.js", "content"]
    environment:
      <<: *server-env
      SERVICE: content
      PORT: 5004
      NODE_ID: content
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      GATEWAY_ENABLED: "false"
    expose: ["5004"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5004/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  data:
    <<: *service-template
    command: ["node", "services/gateway/serviceEntry.js", "data"]
    environment:
      <<: *server-env
      SERVICE: data
      PORT: 5005
      NODE_ID: data
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      GATEWAY_ENABLED: "false"
    expose: ["5005"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5005/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ---- Background worker ------------------------------------------------
  # Shares the API image, runs the maintenance loop (story expiry, scheduled
  # channel posts, notification pruning, stale calls). Safe to scale: every job
  # takes a Redis lock. API replicas run with SCHEDULER_ENABLED=false.
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "services/worker.js"]
    environment:
      <<: *server-env
      NODE_ID: worker
      GRPC_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks: [gbchat-network]

  # ---- Internal load balancer -------------------------------------------
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - server1
      - server2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/lb-health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [gbchat-network]

  # ---- Web client --------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - lb
    networks: [gbchat-network]

volumes:
  mongodb_data:
  redis_data:
  uploads:

networks:
  gbchat-network:
    driver: bridge
