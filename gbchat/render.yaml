services:
  # Backend API Server (Only Server - Client hosted on Netlify)
  - type: web
    name: gbchat-server
    env: node
    region: oregon
    plan: starter
    branch: main
    rootDir: server
    buildCommand: npm ci --production=false
    startCommand: node index.js
    healthCheckPath: /api/system/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://devtechs001.github.io,https://gbchat.netlify.app
      - key: CORS_ORIGIN
        value: https://devtechs001.github.io,https://gbchat.netlify.app
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 600
      - key: RATE_LIMIT_AUTH_MAX
        value: 20
      - key: RATE_LIMIT_WRITE_MAX
        value: 120
      - key: TRUST_PROXY
        value: 1
      - key: NODE_ID
        value: gbchat-server-1
      - key: REDIS_URL
        sync: false
      - key: GRPC_ENABLED
        value: "true"
      - key: GRPC_PORT
        value: "50051"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  # MongoDB Atlas (external - add connection string in environment variables)
  # Render doesn't have native MongoDB, so use MongoDB Atlas free tier
  # Add MONGODB_URI to environment variables
