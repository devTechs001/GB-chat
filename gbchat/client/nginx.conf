# GBChat client — serves the SPA and proxies API + WebSocket traffic
# to the backend load balancer (service name `lb` in docker-compose).

upstream gbchat_api {
    server lb:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Long-cache immutable build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API
    location /api/ {
        proxy_pass http://gbchat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Uploaded media (served by the API nodes)
    location /uploads/ {
        proxy_pass http://gbchat_api;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 7d;
    }

    # Socket.IO (WebSocket upgrade + sticky sessions)
    location /socket.io/ {
        proxy_pass http://gbchat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
