# GBChat backend load balancer.
#
# Socket.IO needs *sticky* connections while the connect handshake (and the
# long-polling fallback) are in flight. `ip_hash` keeps a client on the same
# replica; once the Redis adapter is enabled the replicas also share rooms and
# broadcasts, so scaling out only needs another `server` line here.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream gbchat_backend {
        ip_hash;
        server server1:5000 max_fails=3 fail_timeout=15s;
        server server2:5000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    # Rate limiting at the edge as well (defence in depth next to the app's
    # express-rate-limit policies).
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 50m;

        # Health endpoint of the LB itself
        location = /lb-health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /api/auth/login {
"            limit_req zone=login_zone burst=10 nodelay;
            proxy_pass http://gbchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://gbchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location /socket.io/ {
            proxy_pass http://gbchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://gbchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
